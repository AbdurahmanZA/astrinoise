; --- ASTRINOISE call filter (Astri-noise, func_astrinoise) ------------------------------------------------------
; Goes in /etc/asterisk/extensions_override_freepbx.conf. FreePBX includes that file first, so this hook
; replaces the stock empty `return()` one in extensions.conf (expect one "priority already in use"
; warning for the stock line on each reload). Remove: delete from this line to "end ASTRINOISE", then
; `asterisk -rx 'dialplan reload'`.
;
; FreePBX runs [macro-dialout-trunk-predial-hook] on the calling channel before it dials a TRUNK
; (outbound calls from desk phones and softphones; never internal calls). [rnnoise-decide] switches
; ASTRINOISE(rx) on for that channel = the caller's voice on its way out, using only AstDB (written by the
; dashboard page, or by hand with `asterisk -rx 'database put rnnoise ...'`):
;   rnnoise/mode          off | all | some      (missing = off)
;   rnnoise/strength      1-100                 (missing = full)
;   rnnoise/max           most cleaned calls at once, 0 or missing = no limit
;   rnnoise/ext/<phone>   on | off              phone = the PJSIP endpoint, a hot-desk phone the user is
;                                               logged on to (AMPUSER/<user>/device), or the user number
; all  = every call except phones set off;  some = only phones set on.  A phone set off always wins.
; Never on an emergency route: FreePBX sets EMERGENCYROUTE=YES on routes of type Emergency, and any
; route whose name contains "emergency" is skipped too. To skip a route by number as well, add
;   same => n,GotoIf($["${ROUTEID}" = "<id>"]?done)   after the EMERGENCYROUTE line.

[macro-dialout-trunk-predial-hook]
exten => s,1,Gosub(rnnoise-decide,s,1())
 same => n,Return()

[rnnoise-decide]
exten => s,1,Set(LOCAL(mode)=${IF($["${RNN_TEST_MODE}" != ""]?${RNN_TEST_MODE}:${DB(rnnoise/mode)})})
 same => n,GotoIf($["${mode}" != "all" & "${mode}" != "some"]?done)
 same => n,GotoIf($["${EMERGENCYROUTE}" = "YES"]?done)
 same => n,GotoIf($["${ROUTENAME}" : ".*[Ee][Mm][Ee][Rr][Gg][Ee][Nn][Cc][Yy]"]?done)
 same => n,Set(LOCAL(keys)=${AMPUSER}&${DB(AMPUSER/${AMPUSER}/device)})
 ; GotoIf, not ExecIf: ExecIf expands its whole argument first, and CHANNEL(endpoint) on a Local
 ; channel (push-dial, follow-me) logs a WARNING on every call.
 same => n,GotoIf($["${CHANNEL(channeltype)}" != "PJSIP"]?keysdone)
 same => n,Set(LOCAL(keys)=${CHANNEL(endpoint)}&${keys})
 same => n(keysdone),Set(LOCAL(st)=)
 same => n,Set(LOCAL(i)=0)
 same => n(next),Set(LOCAL(i)=$[${i} + 1])
 same => n,GotoIf($[${i} > ${FIELDQTY(keys,&)}]?decide)
 same => n,Set(LOCAL(k)=${FILTER(0-9,${CUT(keys,&,${i})})})
 same => n,GotoIf($["${k}" = ""]?next)
 same => n,Set(LOCAL(v)=${DB(rnnoise/ext/${k})})
 same => n,GotoIf($["${v}" = "off"]?done)
 same => n,ExecIf($["${v}" = "on"]?Set(LOCAL(st)=on))
 same => n,Goto(next)
 same => n(decide),GotoIf($["${mode}" = "some" & "${st}" != "on"]?done)
 ; cap: at most rnnoise/max cleaned calls at once; more calls go out uncleaned
 same => n,Set(LOCAL(max)=${DB(rnnoise/max)})
 same => n,GotoIf($["${max}" != "" & "${max}" != "0" & ${GROUP_COUNT(cleaned@rnnoise)} >= 0${max}]?done)
 same => n,Set(GROUP(rnnoise)=cleaned)
 same => n,Set(ASTRINOISE(rx)=${IF($["${DB(rnnoise/strength)}" = ""]?on:${DB(rnnoise/strength)})})
 same => n,NoOp(ASTRINOISE on: mode ${mode}, phones ${keys}, strength ${ASTRINOISE(rx)})
 same => n(done),Return()

; Test the decision without a phone and without touching real calls: the test call carries its own mode
; (RNN_TEST_MODE), so rnnoise/mode stays as it is. <mode>-<phone>, or <mode>-<phone>-e for an emergency route:
;   asterisk -rx 'channel originate Local/all-1001@rnnoise-hook-test application Wait 1'
;   asterisk -rx 'database show rnnoise-test'      -> all-1001 : 100 (cleaned) or 0 (not cleaned)
;   asterisk -rx 'database deltree rnnoise-test'   (tidy up)
[rnnoise-hook-test]
exten => _[aso].,1,Set(RNN_TEST_MODE=${CUT(EXTEN,-,1)})
 same => n,Set(AMPUSER=${CUT(EXTEN,-,2)})
 same => n,ExecIf($["${CUT(EXTEN,-,3)}" = "e"]?Set(EMERGENCYROUTE=YES))
 same => n,Gosub(macro-dialout-trunk-predial-hook,s,1())
 same => n,Set(DB(rnnoise-test/${EXTEN})=${ASTRINOISE(rx)})
 same => n,NoOp(ASTRINOISE hook test for ${EXTEN}: strength now ${ASTRINOISE(rx)})
 same => n,Hangup()
; --- end ASTRINOISE call filter ------------------------------------------------------------------------------

