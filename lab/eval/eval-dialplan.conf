; Astri-noise evaluation (lab only). The ;1 leg plays the noisy u-law file once; the ;2 leg applies the
; filter to the audio it receives (rx) and records it. originate Local/<id>@ev-<mode> extension <id>@ev-play
[ev-play]
exten => _X.,1,Answer()
 same => n,Playback(eval/${EXTEN})
 same => n,Wait(0.4)
 same => n,Hangup()
[ev-none]
exten => _X.,1,Answer()
 same => n,Record(/var/spool/asterisk/eval/none/${EXTEN}.wav,0,30,qkx)
[ev-denoise]
exten => _X.,1,Answer()
 same => n,Set(DENOISE(rx)=on)
 same => n,Record(/var/spool/asterisk/eval/denoise/${EXTEN}.wav,0,30,qkx)
[ev-rnn100]
exten => _X.,1,Answer()
 same => n,Set(ASTRINOISE(rx)=on)
 same => n,Record(/var/spool/asterisk/eval/rnn100/${EXTEN}.wav,0,30,qkx)
[ev-rnn60]
exten => _X.,1,Answer()
 same => n,Set(ASTRINOISE(rx)=60)
 same => n,Record(/var/spool/asterisk/eval/rnn60/${EXTEN}.wav,0,30,qkx)
[ev-rnn80]
exten => _X.,1,Answer()
 same => n,Set(ASTRINOISE(rx)=80)
 same => n,Record(/var/spool/asterisk/eval/rnn80/${EXTEN}.wav,0,30,qkx)
