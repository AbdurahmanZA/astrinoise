; Lab dialplan for testing func_astrinoise (never on a production PBX).
;   channel originate Local/<clip>@rnn-test extension <clip>@rnn-play     cleaned (ASTRINOISE on)
;   channel originate Local/<clip>@raw-test extension <clip>@rnn-play     same path, no filter
;   channel originate Local/<clip>@load-test extension <clip>@rnn-play    cleaned, not recorded (load)
;     ;2 runs the test context: ASTRINOISE(rx) on the audio it receives (= the clip), then Record()/Wait()
;     ;1 runs [rnn-play]: plays the noisy clip in a loop (paced in real time, 20 ms frames)
; Global SECS = seconds per test call (set with: dialplan set global SECS 30).
; Global ENGINE = rnnoise or deepfilter (dialplan set global ENGINE deepfilter).
[globals]
SECS=30
ENGINE=rnnoise

[general]
static=yes
writeprotect=yes

[rnn-play]
exten => _[a-z].,1,Answer()
 same => n(loop),Playback(rnnlab/${EXTEN})
 same => n,Goto(loop)

[rnn-test]
exten => _[a-z].,1,Answer()
 same => n,Set(ASTRINOISE(rx,${ENGINE})=on)
 same => n,Record(/var/spool/asterisk/rnn/${EXTEN}-${ENGINE}-${UNIQUEID}.wav,0,${SECS},qkx)
 same => n,Hangup()

[raw-test]
exten => _[a-z].,1,Answer()
 same => n,Record(/var/spool/asterisk/rnn/${EXTEN}-raw-${UNIQUEID}.wav,0,${SECS},qkx)
 same => n,Hangup()

[load-test]
exten => _[a-z].,1,Answer()
 same => n,Set(ASTRINOISE(rx,${ENGINE})=on)
 same => n,Wait(${SECS})
 same => n,Hangup()

; Same as load-test without the filter: baseline for memory / CPU comparison.
[load-raw]
exten => _[a-z].,1,Answer()
 same => n,Wait(${SECS})
 same => n,Hangup()

; Engine switch check (lab/engines.sh): start with the engine named by the extension, read it back,
; switch to the other engine mid-call, read again.
[engine-check]
exten => _[a-z].,1,Answer()
 same => n,Set(ASTRINOISE(rx,${EXTEN})=80)
 same => n,Wait(3)
 same => n,Set(DB(astrinoise-lab/${EXTEN})=${ASTRINOISE(rx,engine)} ${ASTRINOISE(rx)} ${ASTRINOISE(engines)})
 same => n,Set(ASTRINOISE(rx,${IF($["${EXTEN}" = "rnnoise"]?deepfilter:rnnoise)})=100)
 same => n,Wait(3)
 same => n,Set(DB(astrinoise-lab/${EXTEN}-switched)=${ASTRINOISE(rx,engine)} ${ASTRINOISE(rx)})
 same => n,Set(ASTRINOISE(rx)=off)
 same => n,Set(DB(astrinoise-lab/${EXTEN}-off)=${ASTRINOISE(rx,engine)}x${ASTRINOISE(rx)})
 same => n,Hangup()
